spring:
  application:
    name: dovkal
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    liquibase-schema: dovkal_liqb
    default-schema: dovkal
  servlet:
    multipart:
      enabled: false
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

email:
  from-name: ${EMAIL_FROM_NAME}
  from: ${EMAIL_FROM}
  to: ${EMAIL_TO}
  frontend-download-url: https://kaledinissveikinimas.lt/uzsakymas/%s

stripe:
  secret: ${STRIPE_SECRET}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  greeting-375-price-id: ${STRIPE_GREETING_375_PRICE_ID}
  greeting-750-price-id: ${STRIPE_GREETING_750_PRICE_ID}
  greeting-1125-price-id: ${STRIPE_GREETING_1125_PRICE_ID}
  greeting-1500-price-id: ${STRIPE_GREETING_1500_PRICE_ID}
  success-url: ${STRIPE_SUCCESS_URL}
  cancel-url: ${STRIPE_CANCEL_URL}

heygen:
  base-url: https://api.heygen.com
  api-key: ${HEYGEN_API_KEY}
  webhook-secret: ${HEYGEN_WEBHOOK_SECRET}

kind: Application

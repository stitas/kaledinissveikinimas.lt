name: dovkal_prod

services:
  ui:
    build:
      context: ../dovkal_ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      ORIGIN: ${ORIGIN}
      HOST: 0.0.0.0
      PORT: 3000
      PRIVATE_BACKEND_URL: ${PRIVATE_BACKEND_URL}
      PUBLIC_UMAMI_SCRIPT_SRC: ${PUBLIC_UMAMI_SCRIPT_SRC}
      PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ../dovkal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
      BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}

      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_GREETING_375_PRICE_ID: ${STRIPE_GREETING_375_PRICE_ID}
      STRIPE_GREETING_750_PRICE_ID: ${STRIPE_GREETING_750_PRICE_ID}
      STRIPE_GREETING_1125_PRICE_ID: ${STRIPE_GREETING_1125_PRICE_ID}
      STRIPE_GREETING_1500_PRICE_ID: ${STRIPE_GREETING_1500_PRICE_ID}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}

      HEYGEN_API_KEY: ${HEYGEN_API_KEY}
      HEYGEN_WEBHOOK_SECRET: ${HEYGEN_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - app
      - app_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

networks:
  app:
  app_internal:
    external: true